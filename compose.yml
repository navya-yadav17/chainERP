services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chainerp
      POSTGRES_USER: chainerp
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainerp -d chainerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chainerp
      SPRING_DATASOURCE_USERNAME: chainerp
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
